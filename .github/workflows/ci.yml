name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in auth-config.js background.js popup.js theme.js tests/*.cjs tools/*.js; do
            node --check "$file"
          done
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
      - name: Run offline regression tests
        run: node --test
